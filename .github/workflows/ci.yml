name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit and offline protocol tests
        run: npm test
      - name: Browser and isolated desktop tests (no hardware)
        run: npm run test:e2e
        env:
          CI: 'true'
          MANTIS_TEST_HARDWARE: '0'
